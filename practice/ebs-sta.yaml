---
# pod
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    purpose: ebs-static
    project: balancerr
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: my-ebs-claim
---
# ###########note: if we create lb then automatically nodeport and cluster ip will be created.
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
spec:
  type: LoadBalancer       # ✅ type goes in Service, not Pod
  selector:            # ✅ selector goes in Service — matches Pod labels
    purpose: ebs-static
    project: balancerr
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30001