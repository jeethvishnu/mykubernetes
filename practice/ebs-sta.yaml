apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 5Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-065f3bbe40cd68fe1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-claim
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---

apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    purpose: ebs-dy
spec:
  nodeSelector:                              # ✅ nodeSelector under spec
    topology.kubernetes.io/zone: us-east-1d
  containers:
  - name: app
    image: nginx
    volumeMounts:                            # ✅ volumeMounts inside container
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:                                   # ✅ volumes under spec
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static-claim
---
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
  labels:
    purpose: ebs-dy
spec:
  type: LoadBalancer       # ✅ type goes in Service, not Pod
  selector:            # ✅ selector goes in Service — matches Pod labels
    purpose: ebs-pod
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
