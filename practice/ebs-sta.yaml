# since im using local machine im using this yaml bcs there wont be any volumes EBS is an AWS service — it requires actual AWS EC2 nodes to attach volumes to
# original yaml is below this yaml.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-local-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 50Gi
  storageClassName: ""
  hostPath:
    path: /tmp/nginx-data   # local directory on your machine
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-ebs-claim
spec:
  volumeName: my-local-pv
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 50Gi
