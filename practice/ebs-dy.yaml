apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-claim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    purpose: ebs-dynamic
    project: lenovo
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-claim
---
# ###########note: if we create lb then automatically nodeport and cluster ip will be created.
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
spec:
  type: LoadBalancer       # ✅ type goes in Service, not Pod
  selector:            # ✅ selector goes in Service — matches Pod labels
    purpose: ebs-dynamic
    project: lenovo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30001