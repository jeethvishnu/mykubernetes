kind: Deployment
apiVersion: apps/v1
metadata:
  name: mysql
  labels:
    name: mysql
    component: database
    project: expense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: jeeth22/db:v1
---

kind: Service
apiVersion: v1
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306