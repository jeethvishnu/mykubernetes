kind: Pod
apiVersion: v1
metadata: 
  name: resources
  labels:
    name: vishnu
    value: resources-k8s
spec:
  containers:
  - name: alpine
    image: alpine
    resources:
    # soft limit
      requests:
        memory: "128Mo"
        cpu: "100m"
        # limits should be atleast or more than requests
        # hard limit
      limits:
        memory: "128Mi"
        cpu: "100m"