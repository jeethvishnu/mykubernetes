#node port is used whenever we want t0 connect the internet externally to the nodes inside the cluster.
kind: Pod
apiVersion: v1
metadata: 
  name: pod-np
spec:
  type: NodePort
  selector:
    name: frontend
    project: expense
    component: frontend
    environment: dev
  ports:
    - protocol: TCP
      port: 80 #service port
      targetPort: 80 #target port
      nodePort: 29009 #we can fix the node port like this