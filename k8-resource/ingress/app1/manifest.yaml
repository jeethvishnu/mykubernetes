kind: Deployment
apiVersion: apps/v1
metadata: 
  name: ingress
  labels:
    component: backend
    project: expense
spec:
  selector:
    matchLabels:
      purpose: ingress
      project: app1
  template:
    metadata:
      labels:
        purpose: ingress
        project: app1
    spec:
      containers:
      - name: nginx
        image: jeeth22/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app-1
spec:
  selector:
    purpose: ingress
    project: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/group.name: vjeeth
spec:
  rules:
  - host: "app1.vjeeth.fun" #alb rule
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: app1 #alb rtarget grp
            port:
              number: 80
