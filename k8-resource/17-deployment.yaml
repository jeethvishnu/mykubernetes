kind: Deployment
apiVersion: apps/v1
metadata: 
  name: deploy
  labels:
    component: backend
    project: expense
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
      