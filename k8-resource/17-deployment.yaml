kind: Deployment
apiVersion: apps/v1
metadata:
  name: deploy-set
  labels:
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: backend
  template:
    metadata:
      labels:
        tier: backend
        extra-key: extra-value
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
            
