# PV
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: "GIVE YOUR VOLUME id"
---
# PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static-claim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: efs-static
  resources:
    requests:
      storage: 4Gi
---
# Pod

apiVersion: v1
kind: Pod
metadata:
  name: efs-app
  labels:
    purpose: efs
    project: lenovo
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: efs-static-claim
---

kind: Pod
apiVersion: v1
metadata:
  name: efs-lb
spec:
  type: LoadBalancer
  selector:
    purpose: efs
    project: lenovo
  ports:
  - protocol: TCP
    port: 80 #service port
    targetPort: 80 #target port
  
